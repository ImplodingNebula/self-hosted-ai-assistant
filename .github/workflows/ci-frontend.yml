name: ci-frontend

# Scoped to the frontend tree. packages/api-types is not in the path list on
# purpose: apps/frontend does not import it today (a hand-written lib/types.ts
# stands in for the generated package until that migration happens), so a
# change there cannot affect this job's outcome - revisit the path list if
# the frontend ever starts consuming the generated package.
on:
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/ci-frontend.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json
      - working-directory: apps/frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm ci
          npm run lint
          npm run typecheck --if-present
          npm run build
          npm run test --if-present
