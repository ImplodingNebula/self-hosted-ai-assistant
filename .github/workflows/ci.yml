name: ci

# Commitlint checks the messages of the pull request's own commits, which
# only exist in a pull_request context, and linting a commit message costs
# nothing whether the diff is one line or ten thousand - so this job carries
# no path filter and runs on every pull request. The heavier, code-shaped
# checks (backend tests, frontend build, api-types drift) live in their own
# path-scoped workflows so a docs-only or single-app change does not pay for
# the other apps.
on:
  pull_request:

# Least-privilege GITHUB_TOKEN. commitlint reads PR commits via the API on
# pull_request events, which needs pull-requests: read (the repo default token
# is contents-read-only, hence the earlier "Resource not accessible" 403).
permissions:
  contents: read
  pull-requests: read

# Cancels a superseded run on the same pull request; a push to main is never
# cancelled once started (see the frontend/backend/api-types workflows for the
# reasoning - it is identical here for consistency across the ci-* set).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: wagoid/commitlint-github-action@v6
