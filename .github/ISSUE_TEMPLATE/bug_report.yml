name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [backend, rag, mcp, models, model-manager, chat, auth, attachments, frontend, ui, infra, ci, other]
    validations:
      required: true
  - type: textarea
    id: models
    attributes:
      label: Model setup
      description: Which model server (the bundled container, or a remote endpoint), and which models are installed - `make models` prints both.
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, GPU/VRAM, Docker version, relevant logs.
