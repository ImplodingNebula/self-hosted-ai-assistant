<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="t d" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">Architecture overview</title>
  <desc id="d">The web app talks to the API server. The API server stores data in PostgreSQL, Redis and file storage, and reaches four swappable parts: AI models, the knowledge base, web search, and tools and integrations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1638"/>
      <stop offset="0.6" stop-color="#0a0f26"/>
      <stop offset="1" stop-color="#0c2029"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="610" rx="18" fill="url(#bg)"/>

  <g fill="none" stroke="#4a5890" stroke-width="2">
    <path d="M280 290H330"/>
    <path d="M630 290H665"/>
    <path d="M665 119V521"/>
    <path d="M665 119H700M665 253H700M665 387H700M665 521H700"/>
    <path d="M480 365V430"/>
  </g>

  <g font-size="13" font-weight="600" letter-spacing="2.2" fill="#3fe0c5">
    <text x="30" y="200">WHAT PEOPLE USE</text>
    <text x="330" y="200">THE CORE</text>
    <text x="700" y="44">SWAPPABLE PARTS</text>
  </g>

  <g fill="#141c44" stroke="#2a3568" stroke-width="1.5">
    <rect x="30" y="215" width="250" height="150" rx="14"/>
    <rect x="330" y="430" width="300" height="150" rx="14"/>
    <rect x="700" y="60" width="470" height="118" rx="14"/>
    <rect x="700" y="194" width="470" height="118" rx="14"/>
    <rect x="700" y="328" width="470" height="118" rx="14"/>
    <rect x="700" y="462" width="470" height="118" rx="14"/>
  </g>
  <rect x="330" y="215" width="300" height="150" rx="14" fill="#12263c" stroke="#3fe0c5" stroke-width="1.8"/>

  <g font-size="22" font-weight="700" fill="#eef1fb">
    <text x="52" y="255">Web app</text>
    <text x="352" y="255">API server</text>
    <text x="352" y="470">Data and jobs</text>
    <text x="724" y="102">AI models</text>
    <text x="724" y="236">Knowledge base</text>
    <text x="724" y="370">Web search</text>
    <text x="724" y="504">Tools and integrations</text>
  </g>

  <g font-size="16" fill="#a3aed0">
    <text x="52" y="285">Next.js + TypeScript.</text>
    <text x="52" y="308">Streaming chat, citations,</text>
    <text x="52" y="331">attachments, admin</text>
    <text x="52" y="354">console, sign-in.</text>

    <text x="352" y="287">Python + FastAPI. Plans each</text>
    <text x="352" y="310">turn, streams the answer,</text>
    <text x="352" y="333">enforces who can see what.</text>

    <text x="352" y="502">PostgreSQL for conversations</text>
    <text x="352" y="525">and settings. Redis for background</text>
    <text x="352" y="548">jobs. Files on disk or S3.</text>

    <text x="724" y="132">Local open models through Ollama. Hosted or other</text>
    <text x="724" y="155">runtimes drop in behind the same interface.</text>

    <text x="724" y="266">Documents are split, indexed in Qdrant, and</text>
    <text x="724" y="289">retrieved with their sources for every answer.</text>

    <text x="724" y="400">Self-hosted SearXNG. The model searches, reads</text>
    <text x="724" y="423">pages, and cites them.</text>

    <text x="724" y="534">Built-in tools plus any MCP server: document</text>
    <text x="724" y="557">generation, GitHub, Gmail, Slack and more.</text>
  </g>
</svg>
